  <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"></head><body>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عند طبيب الأسنان</title>
<style>
  :root{--purple:#6c5ce7;--green:#4caf50;--red:#ff7675;--ink:#3a3a4a;--sub:#7c7c92;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;direction:rtl;color:var(--ink);display:flex;justify-content:center;}
  .app{width:100%;max-width:500px;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 24px;position:relative;}
  .sound-toggle{position:fixed;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:transform .15s ease;}
  .sound-toggle:active{transform:scale(0.9);}
  header{text-align:center;padding-top:8px;margin-bottom:10px;}
  header h1{font-size:20px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  header p{font-size:13px;margin:0;color:var(--sub);}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}
  .level-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .level-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px;display:flex;align-items:center;gap:14px;
    cursor:pointer;border:5px solid transparent;transition:transform .15s ease,border-color .2s ease;}
  .level-card:active{transform:scale(0.98);}
  .level-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#f4f1ff;border-radius:16px;flex-shrink:0;}
  .level-card .txt{flex:1;text-align:right;}
  .level-card .txt h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .level-card .txt p{margin:0;font-size:13px;color:var(--sub);}
  .level-card .dots-mini{display:flex;gap:4px;margin-top:8px;}
  .level-card .dots-mini span{width:7px;height:7px;border-radius:50%;background:#e6e6ee;}
  .level-card .dots-mini span.done{background:var(--green);}
  .game-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .back-btn{border:none;background:#fff;border-radius:50%;width:36px;height:36px;box-shadow:0 3px 8px rgba(0,0,0,.1);font-size:16px;cursor:pointer;}
  .progress{display:flex;gap:8px;}
  .progress span{width:12px;height:12px;border-radius:50%;background:#e6e6ee;transition:transform .2s ease,background .2s ease;}
  .progress span.current{background:var(--purple);box-shadow:0 0 0 4px rgba(108,92,231,.25);}
  .progress span.done{background:var(--green);transform:scale(1.15);}
  .prompt-box{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:14px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .prompt-box p{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.7;text-align:right;}
  .speak-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--purple);color:#fff;font-size:16px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;}
  .speak-btn:active{transform:scale(0.92);}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(108,92,231,.5);}to{box-shadow:0 0 0 10px rgba(108,92,231,0);}}
  .cards-wrap{display:flex;flex-direction:column;gap:12px;}
  .card{position:relative;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);border:5px solid transparent;overflow:hidden;
    cursor:pointer;transition:transform .15s ease,border-color .2s ease;}
  .card:active{transform:scale(0.98);}
  .card.locked{cursor:default;}
  .card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;image-rendering:auto;-webkit-user-drag:none;user-select:none;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);animation:shake .4s ease;}
  @keyframes shake{0%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}100%{transform:translateX(0);}}
  .badge{position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;opacity:0;transform:scale(0.4);transition:opacity .3s ease,transform .3s ease;}
  .badge.show{opacity:1;transform:scale(1);}
  .xmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .xmark.show{opacity:1;}
  .xmark span{font-size:64px;color:#ff4d4d;text-shadow:0 2px 6px rgba(0,0,0,.4);font-weight:900;}
  .game-area{transition:opacity .25s ease;}
  .game-area.fading{opacity:0;}
  #gameArea.lvl-2 .prompt-box{padding:10px 14px;margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  #gameArea.lvl-2 .card img{aspect-ratio:16/9;}
  .summary-card{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:28px 20px;text-align:center;margin-top:12px;}
  .summary-card h2{font-size:24px;margin:0 0 6px;}
  .summary-card .score{font-size:34px;font-weight:900;color:var(--purple);margin:10px 0;}
  .stars{font-size:30px;letter-spacing:4px;margin-bottom:14px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .summary-actions button{border:none;padding:11px 18px;border-radius:28px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s ease;}
  .summary-actions button:active{transform:scale(0.94);}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-secondary{background:#f0f0f6;color:var(--ink);}
</style>

<div class="app">
  <button class="sound-toggle" id="soundToggle" aria-label="صوت">🔊</button>
  <header>
    <h1>عند طبيب الأسنان</h1>
    <p>لعبة اختيار السلوك الصحيح</p>
  </header>

  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">🦷</div>
        <div class="txt"><h3>المستوى الأول</h3><p>اختر بين صورتين</p><div class="dots-mini" id="miniDots1"></div></div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt"><h3>المستوى الثاني</h3><p>اختر بين ثلاث صور</p><div class="dots-mini" id="miniDots2"></div></div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="game-top">
      <button class="back-btn" id="backBtn">➡</button>
      <div class="progress" id="progressDots"></div>
    </div>
    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn">🔊</button>
        <p id="questionText">مَاذَا نَفْعَلُ عِنْدَمَا يَطْلُبُ مِنَّا طَبِيبُ الأَسْنَانِ فَتْحَ فَمِنَا؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore">5 / 5</div>
      <div class="stars" id="summaryStars">⭐⭐⭐</div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

const LEVELS = { 1:['open','sad'], 2:['open','cover','turn'] };
const CORRECT = 'open', TRIALS = 5;
const NEXT_DELAY = 800, FADE = 250, X_TIME = 2000;

const A = { q:document.getElementById('audioQuestion'), ok:document.getElementById('audioCorrect'), no:document.getElementById('audioWrong') };
Object.values(A).forEach(a => a.volume = 1);
const $ = id => document.getElementById(id);
let level=1, trial=0, firstTry=0, triedWrong=false, locked=false, soundOn=true, lastOrder='', timers=[];
const done = {1:0, 2:0};

function stopAll(){ Object.values(A).forEach(a=>{a.pause();a.currentTime=0;}); $('speakBtn').classList.remove('speaking'); }
function play(k){
  return new Promise(res=>{
    stopAll();
    if(!soundOn){ setTimeout(res,600); return; }
    const a=A[k]; a.volume=1;
    if(k==='q') $('speakBtn').classList.add('speaking');
    const end=()=>{ a.onended=null; if(k==='q') $('speakBtn').classList.remove('speaking'); res(); };
    a.onended=end;
    const p=a.play(); if(p&&p.catch) p.catch(end);
  });
}
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

function renderDots(){
  const p=$('progressDots'); p.innerHTML='';
  for(let i=0;i<TRIALS;i++){ const s=document.createElement('span'); if(i<trial) s.className='done'; else if(i===trial) s.className='current'; p.appendChild(s); }
}
function renderMini(){
  [1,2].forEach(l=>{ const m=$('miniDots'+l); m.innerHTML=''; for(let i=0;i<TRIALS;i++){ const s=document.createElement('span'); if(i<done[l]) s.className='done'; m.appendChild(s);} });
}

function renderTrial(){
  locked=false; triedWrong=false; renderDots();
  let order; do{ order=shuffle(LEVELS[level]); }while(order.join()===lastOrder);
  lastOrder=order.join();
  const w=$('cardsWrap'); w.innerHTML='';
  order.forEach(k=>{
    const c=document.createElement('div'); c.className='card'; c.dataset.key=k;
    c.innerHTML='<img src="'+IMG[k]+'" alt="" draggable="false"><div class="badge">✓</div><div class="xmark"><span>❌</span></div>';
    c.addEventListener('click',()=>choose(c));
    w.appendChild(c);
  });
  play('q');
}

function choose(card){
  if(locked) return;
  if(card.dataset.key===CORRECT){
    locked=true; if(!triedWrong) firstTry++;
    document.querySelectorAll('.card').forEach(c=>c.classList.add('locked'));
    card.classList.add('correct'); card.querySelector('.badge').classList.add('show');
    play('ok').then(()=>later(nextTrial,NEXT_DELAY));
  }else{
    locked=true; triedWrong=true;
    const x=card.querySelector('.xmark');
    card.classList.add('wrong-flash'); x.classList.add('show');
    const aDone=play('no');
    const xDone=new Promise(r=>later(()=>{ x.classList.remove('show'); card.classList.remove('wrong-flash'); r(); },X_TIME));
    Promise.all([aDone,xDone]).then(()=>{ locked=false; });
  }
}

function nextTrial(){
  trial++; done[level]=Math.max(done[level],trial);
  if(trial>=TRIALS) return showSummary();
  $('gameArea').classList.add('fading');
  later(()=>{ renderTrial(); $('gameArea').classList.remove('fading'); },FADE);
}

function showSummary(){
  stopAll(); renderMini();
  const s = firstTry>=5?3:firstTry>=3?2:1;
  $('summaryScore').textContent = firstTry+' / '+TRIALS;
  $('summaryStars').textContent = '⭐'.repeat(s)+'☆'.repeat(3-s);
  $('nextActionBtn').textContent = level===1 ? 'المستوى التالي' : 'المستويات';
  show('screen-summary');
}

function startLevel(l){
  clearTimers(); stopAll();
  level=l; trial=0; firstTry=0; lastOrder='';
  $('gameArea').className='game-area lvl-'+l;
  show('screen-game'); window.scrollTo(0,0);
  renderTrial();
}
function toLevels(){ clearTimers(); stopAll(); renderMini(); show('screen-levels'); }

document.querySelectorAll('.level-card').forEach(c=>c.addEventListener('click',()=>startLevel(+c.dataset.level)));
$('backBtn').onclick=toLevels;
$('restartLevelBtn').onclick=()=>startLevel(level);
$('nextActionBtn').onclick=()=> level===1 ? startLevel(2) : toLevels();
$('speakBtn').onclick=()=>{ if(!locked) play('q'); };
$('soundToggle').onclick=()=>{ soundOn=!soundOn; $('soundToggle').textContent=soundOn?'🔊':'🔇'; if(!soundOn) stopAll(); };
renderMini();
</script>
